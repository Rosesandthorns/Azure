app:
  name: "DiscordLocalAI"
  log_level: "INFO"

discord:
  token: "YOUR_DISCORD_BOT_TOKEN"
  guild_id: ""
  admin_user_ids: []
  command_prefix: "!"
  rate_limit_seconds: 2

model:
  provider: "local_http"
  endpoint_url: "http://localhost:8000/v1/chat/completions"
  model_name: "local-model"
  timeout_s: 30
  max_tokens: 512
  temperature: 0.7

storage:
  sqlite_path: "./data/memory.db"
  chroma_path: "./data/chroma"
  embedding_dim: 384

memory:
  max_retrievals: 8
  min_importance_to_store: 0.3
  reflection_interval_hours: 6
  proactive_cooldown_minutes: 60

scheduler:
  inactivity_minutes: 30
  curiosity_trigger_count: 3
  max_proactive_per_day: 5

logging:
  transparency_log_path: "./data/transparency.log"
