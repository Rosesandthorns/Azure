app:
  name: "DiscordLocalAI"
  log_level: "INFO"

discord:
  token: "YOUR_DISCORD_BOT_TOKEN"
  guild_id: ""
  admin_user_ids: []
  command_prefix: "!"
  rate_limit_seconds: 2

model:
  provider: "local_http"
  endpoint_url: "http://localhost:8000/v1/chat/completions"
  model_name: "local-model"
  timeout_s: 30
  max_tokens: 512
  temperature: 0.7

storage:
  sqlite_path: "./data/memory.db"
  chroma_path: "./data/chroma"
  embedding_dim: 384

memory:
  max_retrievals: 8
  min_importance_to_store: 0.3
  reflection_interval_hours: 0.5
  proactive_cooldown_minutes: 5
  boredom_decay_minutes: 30
  boredom_increase_on_interaction: 1.0
  thought_stream_interval_minutes: 7
  consciousness_interval_seconds: 45

scheduler:
  inactivity_minutes: 5
  curiosity_trigger_count: 1

persona:
  default_self_interests:
    - systems
    - architecture
    - automation
    - knowledge-bases
    - gaming
    - science

logging:
  transparency_log_path: "./data/transparency.log"
